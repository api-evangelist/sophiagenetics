description: SOPHiA GENETICS (NASDAQ SOPH) is a healthcare technology company democratizing
  data-driven medicine through its cloud-based SOPHiA DDM Platform, which analyzes genomic,
  radiomic, and multimodal data to support clinicians and researchers across oncology,
  hereditary disorders, rare diseases, and precision medicine. The platform spans SOPHiA DDM
  for Genomics, Multimodal, and Radiomics, plus Alamut Visual Plus for variant interpretation and
  the OncoPortal knowledge base. The product is delivered as a login-gated SaaS platform; no
  public developer API or portal is currently published.
